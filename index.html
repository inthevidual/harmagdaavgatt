<script src="magda-face-3d.js"></script>
<script>
  (function () {
    // Mood follows Polymarket's "Next Prime Minister of Sweden" → Magdalena Andersson (Yes price).
    // 50 % = neutral, 100 % = biggest smile, 0 % = deepest frown. A square-root
    // curve makes moderate odds read clearly (28 % → about ¾ of the full frown).
    var MARKET = 'https://gamma-api.polymarket.com/markets/1193094';
    var REFRESH_MS = 5 * 60 * 1000;   // API is cached for 5 min anyway

    var face = new MagdaFace3D(document.getElementById('magda'), { mood: 0, data: 'assets/magda3d.bin' });
    var source = document.getElementById('source');
    var pct = new Intl.NumberFormat('sv-SE', { style: 'percent', maximumFractionDigits: 1 });

    function update() {
      fetch(MARKET, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (m) {
          var p = parseFloat(JSON.parse(m.outcomePrices)[0]);
          if (!isFinite(p)) throw new Error('no price');
          var x = Math.max(-1, Math.min(1, (p - 0.5) * 2));
          face.setMood((x < 0 ? -1 : 1) * Math.sqrt(Math.abs(x)));
          source.innerHTML = 'Humöret regleras av Magdas chans att bli statsminister. Just nu <strong>' + pct.format(p) + '</strong>';
        })
        .catch(function (e) { if (window.console) console.warn('Polymarket fetch failed', e); });
    }
    update();
    setInterval(function () { if (!document.hidden) update(); }, REFRESH_MS);
  })();
</script>
